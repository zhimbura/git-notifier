version: '3.8'

# БД: YDB. Строку подключения задайте в YDB_CONNECTION_STRING
# (локально: grpc://host.docker.internal:2136/local или свой endpoint)

services:
  app:
    container_name: notifier_server
    build:
      context: server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      APP_PORT: "8080"
      APP_HOST: 0.0.0.0
      YDB_CONNECTION_STRING: ${YDB_CONNECTION_STRING:-grpc://host.docker.internal:2136/local}
      TG_API_TOKEN: ${TG_API_TOKEN}
      TG_ADMIN_USERNAME: ${TG_ADMIN_USERNAME:-zhimbura}
      ENABLE_LOGS: "true"
      NOTIFIER_STAND: LOCAL
